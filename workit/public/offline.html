<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#d97742" />
    <title>You're offline · Workit</title>
    <link rel="icon" href="/favicon-32.png" type="image/png" />
    <style>
      :root { --ochre: #d97742; --cream: #faf4ec; --cream-2: #f3ead9; --ink: #1f1612; --ink-soft: #4a3a30; --line: #e5d9c4; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; min-height: 100%; background: var(--cream); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { display: flex; align-items: center; justify-content: center; padding: 2rem; }
      .card { max-width: 28rem; text-align: center; padding: 2.5rem 2rem; background: white; border: 1px solid var(--line); border-radius: 1.25rem; box-shadow: 0 8px 24px -12px rgba(31,22,18,0.12); }
      .icon { width: 64px; height: 64px; border-radius: 50%; background: var(--cream-2); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem; font-size: 28px; }
      h1 { font-family: Georgia, "Times New Roman", serif; font-size: 1.75rem; letter-spacing: -0.01em; margin: 0 0 0.5rem; }
      p { color: var(--ink-soft); line-height: 1.5; margin: 0 0 1.5rem; }
      a { display: inline-block; padding: 0.75rem 1.5rem; border-radius: 999px; background: var(--ochre); color: var(--cream); text-decoration: none; font-weight: 500; }
      .small { display: block; margin-top: 1rem; font-size: 0.75rem; color: #7a6a5e; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden>📡</div>
      <h1>You're offline</h1>
      <p>
        Workit needs an internet connection to load fresh jobs and messages.
        Check your data or wifi and try again.
      </p>
      <a href="/">Try again</a>
      <span class="small">Workit · Made in South Africa</span>
    </main>
  </body>
</html>
