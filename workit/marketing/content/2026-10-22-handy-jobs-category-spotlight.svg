  <rect x="72" y="706" width="936" height="72" rx="18" fill="#1f1612"/>
  <text x="540" y="751" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#faf4ec">You agree the price &#183; ID-verified workers &#183; cash or EFT when done</text>

