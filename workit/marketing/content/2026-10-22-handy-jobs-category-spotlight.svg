  <text x="540" y="320" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic" fill="#b85a2a">Somebody nearby can fix it.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- row 1 -->
    <g>
