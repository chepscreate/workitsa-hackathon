      <text x="736" y="465" font-size="24" font-weight="700" fill="#1f1612">Sticking doors,</text>
      <text x="736" y="494" font-size="24" font-weight="700" fill="#1f1612">loose handles</text>
    </g>
    <!-- row 2 -->
