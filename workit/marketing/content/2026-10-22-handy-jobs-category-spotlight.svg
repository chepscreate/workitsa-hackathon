      <rect x="72" y="534" width="296" height="140" rx="18" fill="#dee6d4"/>
      <rect x="96" y="558" width="36" height="6" rx="3" fill="#5d7a47"/>
      <text x="96" y="594" font-size="16" font-weight="700" letter-spacing="2" fill="#5d7a47">MOUNTING</text>
      <text x="96" y="629" font-size="24" font-weight="700" fill="#1f1612">Shelves &amp;</text>
      <text x="96" y="658" font-size="24" font-weight="700" fill="#1f1612">curtain rails</text>
    </g>
    <g>
      <rect x="392" y="534" width="296" height="140" rx="18" fill="#f0dcc2"/>
      <rect x="416" y="558" width="36" height="6" rx="3" fill="#d97742"/>
      <text x="416" y="594" font-size="16" font-weight="700" letter-spacing="2" fill="#b85a2a">TILING</text>
      <text x="416" y="629" font-size="24" font-weight="700" fill="#1f1612">Re-grouting,</text>
      <text x="416" y="658" font-size="24" font-weight="700" fill="#1f1612">a cracked tile</text>
    </g>
    <g>
      <rect x="712" y="534" width="296" height="140" rx="18" fill="#dee6d4"/>
      <rect x="736" y="558" width="36" height="6" rx="3" fill="#5d7a47"/>
      <text x="736" y="594" font-size="16" font-weight="700" letter-spacing="2" fill="#5d7a47">ASSEMBLY</text>
