      <rect x="416" y="394" width="36" height="6" rx="3" fill="#5d7a47"/>
      <text x="416" y="430" font-size="16" font-weight="700" letter-spacing="2" fill="#5d7a47">PAINTING</text>
      <text x="416" y="465" font-size="24" font-weight="700" fill="#1f1612">A room, a wall,</text>
      <text x="416" y="494" font-size="24" font-weight="700" fill="#1f1612">a front gate</text>
