<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit &#8212; category spotlight: handy jobs around the house</title>
  <desc>Cream Workit social post: wordmark, headline "That dripping tap? Somebody nearby can fix it.", six job tiles (plumbing, painting, fixing, mounting, tiling, assembly), trust strip, workitsa.co.za call to action.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4ec"/>
      <stop offset="1" stop-color="#f1e2cc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#bg1)"/>

  <text x="540" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#d97742">CATEGORY SPOTLIGHT &#183; HANDY JOBS</text>
