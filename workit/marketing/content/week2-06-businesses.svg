<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit &#8212; extra hands for Gauteng businesses</title>
  <desc>Cream Workit social post for businesses: headline "Extra hands, right when you need them", a checklist of benefits (post a shift in minutes, verified workers, agree the rate, free during launch) and a workitsa.co.za call to action.</desc>
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4ec"/>
      <stop offset="1" stop-color="#f1e2cc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#bg6)"/>

  <text x="72" y="76" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="3.5" fill="#d97742">WORKIT &#183; GAUTENG</text>
  <text x="72" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#1f1612">Workit</text>
  <rect x="74" y="168" width="86" height="6" rx="3" fill="#d97742"/>

  <rect x="778" y="60" width="230" height="44" rx="22" fill="#d97742" opacity="0.14"/>
  <text x="893" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#b85a2a">FOR BUSINESSES</text>

  <text x="72" y="286" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#1f1612">Extra hands,</text>
  <text x="72" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#b85a2a">right when you need them.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#5a4636">
    <text x="72" y="424">Cleaning, gardening, security, events, deliveries &#8212;</text>
    <text x="72" y="460">find reliable casual staff close to your site.</text>
  </g>

  <g>
    <circle cx="92" cy="540" r="17" fill="#5d7a47"/>
    <path d="M84 540 l6 7 l12 -13" stroke="#faf4ec" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="128" y="549" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#1f1612">Post a shift in minutes</text>

    <circle cx="92" cy="602" r="17" fill="#5d7a47"/>
    <path d="M84 602 l6 7 l12 -13" stroke="#faf4ec" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="128" y="611" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#1f1612">ID-verified workers respond with offers</text>

    <circle cx="92" cy="664" r="17" fill="#5d7a47"/>
    <path d="M84 664 l6 7 l12 -13" stroke="#faf4ec" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="128" y="673" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#1f1612">Agree the rate directly &#8212; pay on completion</text>

    <circle cx="92" cy="726" r="17" fill="#d97742"/>
    <path d="M84 726 l6 7 l12 -13" stroke="#faf4ec" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="128" y="735" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#1f1612">Free for businesses during launch</text>
  </g>

  <rect x="255" y="800" width="570" height="70" rx="35" fill="#d97742"/>
  <text x="540" y="844" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#faf4ec">List your business &#183; workitsa.co.za</text>

  <text x="540" y="920" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5a4636">Launching across Gauteng &#183; workers rate employers too</text>
</svg>
