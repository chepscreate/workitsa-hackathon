<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit — Sawubona. Dumela. Goeie dag. One marketplace for everyone in Gauteng.</title>
  <desc>Cream Workit social post celebrating Gauteng's languages: three greeting cards (Sawubona, Dumela, Goeie dag), headline about work bringing communities together, trust line and workitsa.co.za call to action.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4ec"/>
      <stop offset="1" stop-color="#f1e2cc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#bg1)"/>
  <rect x="0" y="0" width="1080" height="10" fill="#1f1612"/>

  <!-- logo mark -->
  <g transform="translate(64,50) scale(1.35)">
    <rect x="6" y="6" width="52" height="52" rx="14" fill="#1f1612"/>
    <rect x="9" y="9" width="46" height="46" rx="11" fill="none" stroke="#faf4ec" stroke-width="1.5" opacity=".55"/>
    <path d="M14 19L21 47L28 30L36 47L43 30Q47 22 50 19L50 50" stroke="#faf4ec" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="43" y1="22" x2="57" y2="22" stroke="#faf4ec" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <text x="175" y="106" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#1f1612">Workit</text>

  <rect x="712" y="64" width="304" height="46" rx="23" fill="#dee6d4"/>
  <text x="864" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#3f5a3a">LAUNCHING IN GAUTENG</text>

  <!-- headline -->
  <text x="540" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#1f1612">However you say hello,</text>
  <text x="540" y="270" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#d97742">there's work here for you.</text>

  <line x1="390" y1="304" x2="690" y2="304" stroke="#d97742" stroke-width="3" opacity="0.35"/>

  <!-- three greeting cards -->
  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="72" y="352" width="290" height="230" rx="20" fill="#f0dcc2"/>
      <text x="217" y="446" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#1f1612">Sawubona</text>
      <text x="217" y="482" text-anchor="middle" font-size="19" fill="#5a4636">isiZulu</text>
      <text x="217" y="540" text-anchor="middle" font-size="18" fill="#6a5a4c">&#8220;I see you&#8221;</text>
    </g>
    <g>
      <rect x="395" y="352" width="290" height="230" rx="20" fill="#dee6d4"/>
      <text x="540" y="446" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#1f1612">Dumela</text>
      <text x="540" y="482" text-anchor="middle" font-size="19" fill="#5a4636">Sesotho / Setswana</text>
      <text x="540" y="540" text-anchor="middle" font-size="18" fill="#6a5a4c">&#8220;Hello&#8221;</text>
    </g>
    <g>
      <rect x="718" y="352" width="290" height="230" rx="20" fill="#f0dcc2"/>
      <text x="863" y="446" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#1f1612">Goeie dag</text>
      <text x="863" y="482" text-anchor="middle" font-size="19" fill="#5a4636">Afrikaans</text>
      <text x="863" y="540" text-anchor="middle" font-size="18" fill="#6a5a4c">&#8220;Good day&#8221;</text>
    </g>
  </g>

  <!-- body copy -->
  <text x="540" y="656" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#3a2c20">Gauteng speaks many languages. Workit is built to match &#8212;</text>
  <text x="540" y="694" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#3a2c20">the app works in English, Afrikaans and isiZulu, with more coming.</text>

  <!-- chips row -->
  <rect x="120" y="748" width="230" height="50" rx="25" fill="#1f1612" opacity="0.08"/>
  <rect x="368" y="748" width="200" height="50" rx="25" fill="#1f1612" opacity="0.08"/>
  <rect x="586" y="748" width="230" height="50" rx="25" fill="#1f1612" opacity="0.08"/>
  <rect x="834" y="748" width="126" height="50" rx="25" fill="#d97742" opacity="0.14"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#3a2c20" text-anchor="middle">
    <text x="235" y="780">ID-verified workers</text>
    <text x="468" y="780">Safety toolkit</text>
    <text x="701" y="780">Cash or EFT</text>
    <text x="897" y="780">Free now</text>
  </g>

  <!-- CTA -->
  <rect x="200" y="838" width="680" height="84" rx="42" fill="#d97742"/>
  <text x="540" y="890" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#faf4ec">Post a job or find work &#183; workitsa.co.za</text>

  <text x="540" y="972" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="#5d7a47">Sawubona &#183; Dumela &#183; Goeie dag &#183; Welcome</text>

  <text x="540" y="1046" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#9a8a7a">Furthersky Solutions &#183; Workit</text>
</svg>
