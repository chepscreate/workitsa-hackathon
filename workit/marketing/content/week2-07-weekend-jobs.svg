<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit &#8212; get your Saturday back</title>
  <desc>Cream Workit social post about weekend jobs: headline "Get your Saturday back", scattered chore chips (garden tidy-up, car wash, shopping run, small repairs, flatpack assembly, laundry), and a workitsa.co.za call to action with trilingual greeting.</desc>
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4ec"/>
      <stop offset="1" stop-color="#f1e2cc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#bg7)"/>

  <text x="540" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#d97742">WORKIT &#183; GAUTENG</text>
  <text x="540" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#1f1612">Workit</text>
  <rect x="490" y="170" width="100" height="6" rx="3" fill="#d97742"/>

  <text x="540" y="258" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#1f1612">Get your Saturday back.</text>
  <text x="540" y="314" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#5a4636">Post the weekend list tonight &#8212; someone nearby can take it on.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
    <g transform="rotate(-3 240 427)">
      <rect x="120" y="400" width="240" height="54" rx="27" fill="#f0dcc2"/>
      <text x="240" y="435" text-anchor="middle" fill="#1f1612">Garden tidy-up</text>
    </g>
    <g transform="rotate(2 565 427)">
      <rect x="430" y="400" width="270" height="54" rx="27" fill="#dee6d4"/>
      <text x="565" y="435" text-anchor="middle" fill="#1f1612">Car wash at home</text>
    </g>
    <g transform="rotate(-2 850 427)">
      <rect x="770" y="400" width="160" height="54" rx="27" fill="#fffcf7"/>
      <text x="850" y="435" text-anchor="middle" fill="#1f1612">Errands</text>
    </g>
    <g transform="rotate(2 300 527)">
      <rect x="190" y="500" width="220" height="54" rx="27" fill="#dee6d4"/>
      <text x="300" y="535" text-anchor="middle" fill="#1f1612">Shopping run</text>
    </g>
    <g transform="rotate(-2 615 527)">
      <rect x="480" y="500" width="270" height="54" rx="27" fill="#fffcf7"/>
      <text x="615" y="535" text-anchor="middle" fill="#1f1612">Gutter cleaning</text>
    </g>
    <g transform="rotate(3 875 527)">
      <rect x="760" y="500" width="230" height="54" rx="27" fill="#f0dcc2"/>
      <text x="875" y="535" text-anchor="middle" fill="#1f1612">Small repairs</text>
    </g>
    <g transform="rotate(-2 390 627)">
      <rect x="240" y="600" width="300" height="54" rx="27" fill="#f0dcc2"/>
      <text x="390" y="635" text-anchor="middle" fill="#1f1612">Flatpack assembly</text>
    </g>
    <g transform="rotate(2 750 627)">
      <rect x="600" y="600" width="300" height="54" rx="27" fill="#dee6d4"/>
      <text x="750" y="635" text-anchor="middle" fill="#1f1612">Laundry &amp; ironing</text>
    </g>
  </g>

  <text x="540" y="712" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#5a4636">Verified workers nearby &#183; agree the price &#183; pay when it&#8217;s done</text>

  <rect x="250" y="756" width="580" height="70" rx="35" fill="#d97742"/>
  <text x="540" y="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#faf4ec">Post a weekend job &#183; workitsa.co.za</text>

  <text x="540" y="892" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#5d7a47">Sawubona &#183; Dumela &#183; Goeie dag</text>
</svg>
