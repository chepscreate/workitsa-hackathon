<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit &#8212; get your time back, one job at a time</title>
  <desc>Cream Workit social post: wordmark, headline "Get your time back, one job at a time.", a clock illustration with a checkmark, a three-line value list, trust line, workitsa.co.za call to action and trilingual greeting.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4ec"/>
      <stop offset="1" stop-color="#f1e2cc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#bg1)"/>

  <text x="540" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#d97742">WORKIT &#183; GAUTENG</text>
  <text x="540" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#1f1612">Workit</text>
  <rect x="490" y="170" width="100" height="6" rx="3" fill="#d97742"/>

  <text x="540" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#1f1612">Get your time back,</text>
  <text x="540" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#1f1612">one job at a time.</text>

  <g>
    <circle cx="540" cy="440" r="90" fill="#f0dcc2"/>
    <circle cx="540" cy="440" r="90" fill="none" stroke="#d97742" stroke-width="6"/>
    <line x1="540" y1="440" x2="540" y2="388" stroke="#1f1612" stroke-width="7" stroke-linecap="round"/>
    <line x1="540" y1="440" x2="576" y2="452" stroke="#1f1612" stroke-width="7" stroke-linecap="round"/>
    <circle cx="540" cy="440" r="7" fill="#1f1612"/>
    <circle cx="612" cy="508" r="34" fill="#5d7a47"/>
    <path d="M596 508 l12 12 22 -24" fill="none" stroke="#faf4ec" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <circle cx="120" cy="616" r="7" fill="#d97742"/>
      <text x="150" y="624" font-size="26" fill="#1f1612">Post the job &#8212; takes two minutes</text>
    </g>
    <g>
      <circle cx="120" cy="672" r="7" fill="#5d7a47"/>
      <text x="150" y="680" font-size="26" fill="#1f1612">A verified worker nearby comes to you</text>
    </g>
    <g>
      <circle cx="120" cy="728" r="7" fill="#b85a2a"/>
      <text x="150" y="736" font-size="26" fill="#1f1612">Pay cash or EFT once it&#8217;s done</text>
    </g>
  </g>

  <text x="540" y="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5a4636">No card needed &#183; free during launch &#183; launching in Gauteng</text>

  <rect x="240" y="838" width="600" height="70" rx="35" fill="#d97742"/>
  <text x="540" y="882" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#faf4ec">Get your time back &#183; workitsa.co.za</text>

  <text x="540" y="968" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#5d7a47">Sawubona &#183; Dumela &#183; Goeie dag</text>
</svg>
