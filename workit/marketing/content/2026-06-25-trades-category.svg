    <line x1="16" y1="-27" x2="6" y2="-6" stroke="#1F1710" stroke-width="6" stroke-linecap="round"/>
    <rect x="0" y="-8" width="11" height="40" rx="5.5" fill="#1F1710"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1F1710" text-anchor="middle">
    <text x="165" y="736">Plumbing</text>
    <text x="405" y="736">Electrical</text>
    <text x="645" y="736">Handyman</text>
    <text x="885" y="736">Painting</text>
