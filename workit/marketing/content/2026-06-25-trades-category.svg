<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit — Plumbing, wiring, repairs, sorted by someone nearby</title>
  <desc>Category spotlight post for tradespeople on Workit: plumbing, electrical, handyman and painting jobs, with verified workers, free during launch, and cash or EFT on completion.</desc>

  <rect x="0" y="0" width="1080" height="1080" fill="#F6EFE6"/>

  <!-- logo mark -->
  <g transform="translate(64,56) scale(1.35)">
    <rect x="6" y="6" width="52" height="52" rx="14" fill="#1F1710"/>
    <rect x="9" y="9" width="46" height="46" rx="11" fill="none" stroke="#F6EFE6" stroke-width="1.5" opacity=".55"/>
    <path d="M14 19L21 47L28 30L36 47L43 30Q47 22 50 19L50 50" stroke="#F6EFE6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="43" y1="22" x2="57" y2="22" stroke="#F6EFE6" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <text x="175" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#1F1710">Workit</text>

  <rect x="740" y="70" width="276" height="46" rx="23" fill="#5E7D63" opacity="0.15"/>
  <text x="878" y="99" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#3F5A43">LAUNCHING IN GAUTENG</text>

  <!-- headline -->
  <text x="70" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#1F1710">Plumbing. Wiring. Repairs.</text>
  <text x="70" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#1F1710">Sorted by someone nearby.</text>

  <!-- subtext -->
  <text x="70" y="416" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#5A4A3C">Verified tradespeople near you on Workit —</text>
  <text x="70" y="456" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#5A4A3C">post the job, get fair offers, pay when it's done.</text>

  <!-- icon row -->
  <g>
    <circle cx="165" cy="620" r="78" fill="#5E7D63" opacity="0.16"/>
    <circle cx="405" cy="620" r="78" fill="#C2632E" opacity="0.14"/>
    <circle cx="645" cy="620" r="78" fill="#5E7D63" opacity="0.16"/>
    <circle cx="885" cy="620" r="78" fill="#C2632E" opacity="0.14"/>
  </g>

  <!-- Plumbing: water drop -->
  <g transform="translate(165,612)">
    <path d="M0,-30 C18,-8 18,16 0,30 C-18,16 -18,-8 0,-30 Z" fill="#1F1710"/>
  </g>

