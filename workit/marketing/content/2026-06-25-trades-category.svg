  <rect x="150" y="800" width="290" height="56" rx="28" fill="#C2632E" opacity="0.12"/>
  <rect x="460" y="800" width="260" height="56" rx="28" fill="#C2632E" opacity="0.12"/>
  <rect x="740" y="800" width="190" height="56" rx="28" fill="#C2632E" opacity="0.12"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#9A4E22" text-anchor="middle">
