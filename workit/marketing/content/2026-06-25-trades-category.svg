  <text x="540" y="964" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#F6EFE6">Get started &#183; workitsa.co.za</text>

  <text x="540" y="1030" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8A7A6B">Furthersky Solutions &#183; Workit</text>
