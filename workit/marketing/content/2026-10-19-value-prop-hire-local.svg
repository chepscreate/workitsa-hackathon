<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit &#8212; hire from your own neighbourhood</title>
  <desc>Cream Workit social post: wordmark, headline "Good help is closer than you think.", a map-pin with neighbourhood rings, three value points (workers near you, ID-verified on both sides, pay cash or EFT when it's done), free-during-launch line, workitsa.co.za call to action.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4ec"/>
      <stop offset="1" stop-color="#f1e2cc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#bg1)"/>

  <text x="540" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#d97742">WORKIT &#183; GAUTENG</text>
  <text x="540" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#1f1612">Workit</text>
  <rect x="490" y="170" width="100" height="6" rx="3" fill="#d97742"/>

  <text x="540" y="252" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#1f1612">Good help is closer</text>
  <text x="540" y="314" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#1f1612">than you think.</text>

  <!-- neighbourhood rings + pin -->
  <g transform="translate(250,500)">
    <circle cx="0" cy="0" r="132" fill="none" stroke="#5d7a47" stroke-width="3" stroke-dasharray="6 10" opacity="0.55"/>
    <circle cx="0" cy="0" r="92" fill="#dee6d4" opacity="0.7"/>
    <circle cx="0" cy="0" r="52" fill="#dee6d4"/>
    <circle cx="-96" cy="-58" r="11" fill="#5d7a47"/>
    <circle cx="104" cy="-40" r="11" fill="#5d7a47"/>
    <circle cx="-70" cy="88" r="11" fill="#5d7a47"/>
    <circle cx="82" cy="92" r="11" fill="#5d7a47"/>
    <path d="M0,-78 C-34,-78 -52,-54 -52,-30 C-52,4 -14,34 0,58 C14,34 52,4 52,-30 C52,-54 34,-78 0,-78 Z" fill="#d97742"/>
    <circle cx="0" cy="-30" r="18" fill="#faf4ec"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="430" y="376" width="578" height="76" rx="16" fill="#f0dcc2"/>
    <circle cx="470" cy="414" r="12" fill="#d97742"/>
    <text x="500" y="408" font-size="26" font-weight="700" fill="#1f1612">Workers near your job</text>
    <text x="500" y="436" font-size="18" fill="#5a4636">Less travel for them, quicker help for you.</text>

    <rect x="430" y="466" width="578" height="76" rx="16" fill="#dee6d4"/>
    <circle cx="470" cy="504" r="12" fill="#5d7a47"/>
    <text x="500" y="498" font-size="26" font-weight="700" fill="#1f1612">ID-verified, both sides</text>
    <text x="500" y="526" font-size="18" fill="#5a4636">You know who&#8217;s coming. They know who they&#8217;re working for.</text>

    <rect x="430" y="556" width="578" height="76" rx="16" fill="#f0dcc2"/>
    <circle cx="470" cy="594" r="12" fill="#b85a2a"/>
    <text x="500" y="588" font-size="26" font-weight="700" fill="#1f1612">Pay when it&#8217;s done</text>
    <text x="500" y="616" font-size="18" fill="#5a4636">Cash or EFT, straight to the worker.</text>
  </g>

  <text x="540" y="718" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#1f1612">Hire from your own neighbourhood.</text>

  <text x="540" y="776" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5a4636">No card needed &#183; free during launch &#183; launching in Gauteng</text>

  <rect x="250" y="812" width="580" height="70" rx="35" fill="#d97742"/>
  <text x="540" y="856" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#faf4ec">Post a job &#183; workitsa.co.za</text>

  <text x="540" y="940" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#5d7a47">Sawubona &#183; Dumela &#183; Goeie dag</text>
</svg>
