    <text x="176" y="426" font-size="18" font-weight="700" letter-spacing="2" fill="#5d7a47">JOBS NEAR YOU</text>

    <g>
      <rect x="164" y="448" width="752" height="86" rx="16" fill="#f0dcc2"/>
      <circle cx="216" cy="491" r="26" fill="#d97742"/>
      <text x="216" y="500" text-anchor="middle" font-size="24" fill="#faf4ec">&#127807;</text>
      <text x="256" y="483" font-size="25" font-weight="700" fill="#1f1612">Gardening &#183; Midrand</text>
      <text x="256" y="513" font-size="19" fill="#5a4636">Posted today &#183; 2.4 km away</text>
      <rect x="792" y="470" width="92" height="42" rx="21" fill="#5d7a47"/>
      <text x="838" y="497" text-anchor="middle" font-size="17" font-weight="700" fill="#faf4ec">Accept</text>
    </g>

    <g>
      <rect x="164" y="546" width="752" height="86" rx="16" fill="#dee6d4"/>
      <circle cx="216" cy="589" r="26" fill="#5d7a47"/>
      <text x="216" y="598" text-anchor="middle" font-size="24" fill="#faf4ec">&#129529;</text>
      <text x="256" y="581" font-size="25" font-weight="700" fill="#1f1612">Cleaning &#183; Alexandra</text>
      <text x="256" y="611" font-size="19" fill="#5a4636">Posted today &#183; 1.1 km away</text>
      <rect x="792" y="568" width="92" height="42" rx="21" fill="#d97742"/>
      <text x="838" y="595" text-anchor="middle" font-size="17" font-weight="700" fill="#faf4ec">Accept</text>
    </g>

    <g>
      <rect x="164" y="644" width="752" height="86" rx="16" fill="#f0dcc2"/>
      <circle cx="216" cy="687" r="26" fill="#b85a2a"/>
      <text x="216" y="696" text-anchor="middle" font-size="24" fill="#faf4ec">&#128667;</text>
      <text x="256" y="679" font-size="25" font-weight="700" fill="#1f1612">Deliveries &#183; Soweto</text>
      <text x="256" y="709" font-size="19" fill="#5a4636">Posted today &#183; 3.8 km away</text>
      <rect x="792" y="666" width="92" height="42" rx="21" fill="#5d7a47"/>
      <text x="838" y="693" text-anchor="middle" font-size="17" font-weight="700" fill="#faf4ec">Accept</text>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f1612">
    <rect x="86" y="770" width="270" height="50" rx="25" fill="#f0dcc2"/>
    <text x="221" y="801" text-anchor="middle">Browse jobs nearby</text>
    <rect x="368" y="770" width="290" height="50" rx="25" fill="#dee6d4"/>
    <text x="513" y="801" text-anchor="middle">Accept or counter the price</text>
    <rect x="670" y="770" width="324" height="50" rx="25" fill="#f0dcc2"/>
    <text x="832" y="801" text-anchor="middle">Get paid when it&#8217;s done</text>
  </g>

  <text x="540" y="872" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#5a4636">ID-verified both ways &#183; free during launch &#183; launching in Gauteng</text>

  <rect x="270" y="908" width="540" height="70" rx="35" fill="#d97742"/>
  <text x="540" y="952" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#faf4ec">Find work today &#183; workitsa.co.za</text>

  <text x="540" y="1030" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#5d7a47">Sawubona &#183; Dumela &#183; Goeie dag</text>
</svg>
