<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit &#8212; find work near you</title>
  <desc>Cream Workit social post for workers: wordmark, headline "Work near you, waiting.", a mock phone list of nearby job categories (gardening, cleaning, deliveries), three quick steps to get picked, trust line, workitsa.co.za call to action and trilingual greeting.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4ec"/>
      <stop offset="1" stop-color="#f1e2cc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#bg1)"/>

  <text x="540" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#d97742">WORKIT &#183; GAUTENG</text>
  <text x="540" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#1f1612">Workit</text>
  <rect x="490" y="170" width="100" height="6" rx="3" fill="#d97742"/>

  <text x="540" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#1f1612">Work near you,</text>
  <text x="540" y="296" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#d97742">waiting.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5a4636" text-anchor="middle">
    <text x="540" y="342">No CV, no waiting in line &#8212; just jobs close to home.</text>
  </g>

  <!-- mock phone job list -->
  <g font-family="Arial, Helvetica, sans-serif">
