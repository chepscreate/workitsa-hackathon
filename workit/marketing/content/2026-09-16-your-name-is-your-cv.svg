<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit &#8212; your good name is your CV</title>
  <desc>Cream Workit social post for workers: wordmark, headline "Your good name is your CV.", a mock profile card showing an ID-verified badge, a star rating row and category chips, three quick steps to build your name, trust line, workitsa.co.za call to action and trilingual greeting.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4ec"/>
      <stop offset="1" stop-color="#f1e2cc"/>
    </linearGradient>
    <polygon id="star" points="0,-14 3.5,-4.9 13.3,-4.3 5.7,1.9 8.2,11.3 0,6 -8.2,11.3 -5.7,1.9 -13.3,-4.3 -3.5,-4.9" fill="#d97742"/>
  </defs>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#bg1)"/>

  <text x="540" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#d97742">WORKIT &#183; GAUTENG</text>
  <text x="540" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#1f1612">Workit</text>
  <rect x="490" y="170" width="100" height="6" rx="3" fill="#d97742"/>

  <text x="540" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#1f1612">Your good name</text>
  <text x="540" y="296" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#d97742">is your CV.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5a4636" text-anchor="middle">
    <text x="540" y="342">Skip the fancy r&#233;sum&#233; &#8212; every job you do well builds it here.</text>
  </g>

  <!-- mock profile card -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="140" y="382" width="800" height="360" rx="24" fill="#ffffff" stroke="#e6d7c3" stroke-width="2"/>
    <text x="176" y="426" font-size="18" font-weight="700" letter-spacing="2" fill="#5d7a47">YOUR WORKIT PROFILE</text>

    <!-- row 1: verified identity -->
    <g>
      <rect x="164" y="448" width="752" height="86" rx="16" fill="#f0dcc2"/>
      <circle cx="216" cy="491" r="26" fill="#5d7a47"/>
      <circle cx="216" cy="483" r="8" fill="#faf4ec"/>
      <path d="M 199 507 a 17 13 0 0 1 34 0 Z" fill="#faf4ec"/>
      <text x="256" y="483" font-size="25" font-weight="700" fill="#1f1612">ID-verified worker</text>
      <text x="256" y="513" font-size="19" fill="#5a4636">Ready to work in Gauteng</text>
      <rect x="784" y="470" width="100" height="42" rx="21" fill="#5d7a47"/>
      <text x="834" y="497" text-anchor="middle" font-size="16" font-weight="700" fill="#faf4ec">VERIFIED</text>
    </g>

    <!-- row 2: rating -->
    <g>
      <rect x="164" y="546" width="752" height="86" rx="16" fill="#dee6d4"/>
      <use href="#star" x="196" y="589"/>
      <use href="#star" x="238" y="589"/>
      <use href="#star" x="280" y="589"/>
      <use href="#star" x="322" y="589"/>
      <use href="#star" x="364" y="589"/>
      <text x="404" y="581" font-size="25" font-weight="700" fill="#1f1612">Rating builds with every job</text>
      <text x="404" y="611" font-size="19" fill="#5a4636">Good work gets noticed nearby</text>
    </g>

    <!-- row 3: categories -->
    <g font-size="18" font-weight="700" fill="#faf4ec">
      <rect x="164" y="644" width="752" height="86" rx="16" fill="#f0dcc2"/>
      <text x="176" y="666" font-size="15" font-weight="700" letter-spacing="1" fill="#5a4636">WORKS ACROSS</text>
      <rect x="176" y="678" width="164" height="42" rx="21" fill="#5d7a47"/>
      <text x="258" y="705" text-anchor="middle">Gardening</text>
      <rect x="352" y="678" width="150" height="42" rx="21" fill="#d97742"/>
      <text x="427" y="705" text-anchor="middle">Cleaning</text>
      <rect x="514" y="678" width="164" height="42" rx="21" fill="#b85a2a"/>
      <text x="596" y="705" text-anchor="middle">Deliveries</text>
      <text x="700" y="705" fill="#5a4636" font-size="18" font-weight="700">+ more</text>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1f1612">
    <rect x="90" y="770" width="248" height="50" rx="25" fill="#f0dcc2"/>
    <text x="214" y="801" text-anchor="middle">Get ID-verified once</text>
    <rect x="356" y="770" width="230" height="50" rx="25" fill="#dee6d4"/>
    <text x="471" y="801" text-anchor="middle">Do the job well</text>
    <rect x="604" y="770" width="290" height="50" rx="25" fill="#f0dcc2"/>
    <text x="749" y="801" text-anchor="middle">Ratings bring more offers</text>
  </g>

  <text x="540" y="872" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#5a4636">Two-way ratings &#183; free during launch &#183; launching in Gauteng</text>

  <rect x="260" y="908" width="560" height="70" rx="35" fill="#d97742"/>
  <text x="540" y="952" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#faf4ec">Build your profile &#183; workitsa.co.za</text>

  <text x="540" y="1030" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#5d7a47">Sawubona &#183; Dumela &#183; Goeie dag</text>
</svg>
