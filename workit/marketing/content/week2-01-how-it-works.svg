<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit &#8212; how it works in three steps</title>
  <desc>Cream Workit social post: wordmark, headline "Three steps. That's it.", three numbered step cards (post your job, nearby workers respond, pay when done), trust line, workitsa.co.za call to action and trilingual greeting.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4ec"/>
      <stop offset="1" stop-color="#f1e2cc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#bg1)"/>

  <text x="540" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#d97742">WORKIT &#183; GAUTENG</text>
  <text x="540" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#1f1612">Workit</text>
  <rect x="490" y="170" width="100" height="6" rx="3" fill="#d97742"/>

  <text x="540" y="256" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" fill="#1f1612">Three steps. That&#8217;s it.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="72" y="306" width="936" height="118" rx="18" fill="#f0dcc2"/>
      <circle cx="140" cy="365" r="34" fill="#d97742"/>
      <text x="140" y="379" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#faf4ec">1</text>
      <text x="204" y="356" font-size="30" font-weight="700" fill="#1f1612">Post your job</text>
      <text x="204" y="392" font-size="19" fill="#5a4636">Say what you need, where and when &#8212; and what you&#8217;ll pay.</text>
    </g>
    <g>
      <rect x="72" y="448" width="936" height="118" rx="18" fill="#dee6d4"/>
      <circle cx="140" cy="507" r="34" fill="#5d7a47"/>
      <text x="140" y="521" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#faf4ec">2</text>
      <text x="204" y="498" font-size="30" font-weight="700" fill="#1f1612">Nearby workers respond</text>
      <text x="204" y="534" font-size="19" fill="#5a4636">ID-verified workers accept your offer &#8212; or send you theirs.</text>
    </g>
    <g>
      <rect x="72" y="590" width="936" height="118" rx="18" fill="#f0dcc2"/>
      <circle cx="140" cy="649" r="34" fill="#b85a2a"/>
      <text x="140" y="663" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#faf4ec">3</text>
      <text x="204" y="640" font-size="30" font-weight="700" fill="#1f1612">Pay when the job is done</text>
      <text x="204" y="676" font-size="19" fill="#5a4636">Cash or EFT, straight to the worker. Then you rate each other.</text>
    </g>
  </g>

  <text x="540" y="768" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5a4636">No card needed &#183; free during launch &#183; launching in Gauteng</text>

  <rect x="250" y="806" width="580" height="70" rx="35" fill="#d97742"/>
  <text x="540" y="850" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#faf4ec">Post your first job &#183; workitsa.co.za</text>

  <text x="540" y="936" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#5d7a47">Sawubona &#183; Dumela &#183; Goeie dag</text>
</svg>
