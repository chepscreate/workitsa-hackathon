<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit &#8212; small features, big peace of mind</title>
  <desc>Cream Workit social post about the safety toolkit: doorstep start code, sharing the job with a trusted contact, and an SOS button, with a workitsa.co.za call to action.</desc>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4ec"/>
      <stop offset="1" stop-color="#f1e2cc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#bg4)"/>

  <text x="72" y="76" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="3.5" fill="#d97742">WORKIT &#183; GAUTENG</text>
  <text x="72" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#1f1612">Workit</text>
  <rect x="74" y="168" width="86" height="6" rx="3" fill="#d97742"/>

  <rect x="762" y="60" width="246" height="44" rx="22" fill="#5d7a47" opacity="0.14"/>
  <text x="885" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#5d7a47">SAFETY, BUILT IN</text>

  <text x="72" y="282" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" fill="#1f1612">Small features.</text>
  <text x="72" y="354" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" fill="#b85a2a">Big peace of mind.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#5a4636">
    <text x="72" y="418">Thoughtful touches on every job &#8212; for the</text>
    <text x="72" y="454">person hiring and the person working.</text>
  </g>

  <circle cx="200" cy="610" r="84" fill="#dee6d4"/>
  <g transform="translate(200,610)">
    <rect x="-26" y="-42" width="52" height="84" rx="11" fill="none" stroke="#1f1612" stroke-width="6"/>
    <circle cx="-10" cy="-14" r="5.5" fill="#1f1612"/>
    <circle cx="10" cy="-14" r="5.5" fill="#1f1612"/>
    <circle cx="-10" cy="8" r="5.5" fill="#1f1612"/>
    <circle cx="10" cy="8" r="5.5" fill="#1f1612"/>
    <circle cx="0" cy="28" r="5" fill="#1f1612" opacity="0.5"/>
  </g>

  <circle cx="540" cy="610" r="84" fill="#f0dcc2"/>
  <g transform="translate(540,610)">
    <circle cx="-16" cy="-20" r="14" fill="#1f1612"/>
    <path d="M-36 30 C-36 6 -26 -6 -16 -6 C-6 -6 4 6 4 30 Z" fill="#1f1612"/>
    <circle cx="26" cy="-26" r="9" fill="#d97742"/>
    <circle cx="26" cy="8" r="9" fill="#d97742"/>
    <circle cx="45" cy="-9" r="9" fill="#d97742"/>
    <line x1="26" y1="-26" x2="45" y2="-9" stroke="#d97742" stroke-width="4"/>
    <line x1="26" y1="8" x2="45" y2="-9" stroke="#d97742" stroke-width="4"/>
  </g>

  <circle cx="880" cy="610" r="84" fill="#dee6d4"/>
  <g transform="translate(880,610)">
    <circle cx="0" cy="0" r="44" fill="none" stroke="#a93226" stroke-width="7"/>
    <text x="0" y="9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#a93226">SOS</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#1f1612" text-anchor="middle">
    <text x="200" y="734">Doorstep code</text>
    <text x="540" y="734">Tell someone</text>
    <text x="880" y="734">SOS on hand</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5a4636" text-anchor="middle">
    <text x="200" y="762">confirm the right person</text>
    <text x="540" y="762">share the job with a contact</text>
    <text x="880" y="762">quick help if ever needed</text>
  </g>

  <text x="540" y="826" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5a4636">Workers are ID-verified, and both sides rate each other after every job.</text>

  <rect x="305" y="862" width="470" height="70" rx="35" fill="#d97742"/>
  <text x="540" y="906" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#faf4ec">Hire safely &#183; workitsa.co.za</text>

  <text x="540" y="982" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#5a4636">Free during launch &#183; Gauteng</text>
</svg>
