<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit &#8212; someone always knows where you are</title>
  <desc>Cream Workit social post spotlighting the trusted-contact share safety feature: share job details with someone you trust before a job starts, alongside the doorstep code and SOS button, with a workitsa.co.za call to action.</desc>
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4ec"/>
      <stop offset="1" stop-color="#f1e2cc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#bg5)"/>

  <text x="72" y="76" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="3.5" fill="#d97742">WORKIT &#183; GAUTENG</text>
  <text x="72" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#1f1612">Workit</text>
  <rect x="74" y="168" width="86" height="6" rx="3" fill="#d97742"/>

  <rect x="712" y="60" width="296" height="44" rx="22" fill="#5d7a47" opacity="0.14"/>
  <text x="860" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.6" fill="#5d7a47">SAFETY FEATURE</text>

  <text x="72" y="272" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" fill="#1f1612">Someone always</text>
  <text x="72" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" fill="#b85a2a">knows where you are.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#5a4636">
    <text x="72" y="404">Before a job starts, share the details &#8212; who,</text>
    <text x="72" y="440">where, when &#8212; with someone you trust. One tap.</text>
  </g>

  <rect x="72" y="486" width="936" height="238" rx="24" fill="#f0dcc2"/>
  <circle cx="180" cy="605" r="56" fill="#dee6d4"/>
  <g transform="translate(180,605)">
    <circle cx="-20" cy="-8" r="18" fill="#1f1612"/>
    <path d="M-44 34 C-44 6 -32 -10 -20 -10 C-8 -10 4 6 4 34 Z" fill="#1f1612"/>
    <circle cx="24" cy="-14" r="15" fill="#d97742"/>
    <path d="M4 30 C4 8 14 -2 24 -2 C34 -2 44 8 44 30 Z" fill="#d97742"/>
    <path d="M-2 -30 C6 -38 14 -38 20 -32" stroke="#5d7a47" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-6 -36 L20 -32 L14 -18" stroke="#5d7a47" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <text x="270" y="580" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1f1612">Share job with a contact</text>
  <text x="270" y="618" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#5a4636">They see the worker's name, photo and job</text>
  <text x="270" y="646" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#5a4636">location &#8212; no extra app, no extra step.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5a4636">
    <circle cx="96" cy="678" r="4.5" fill="#5d7a47"/>
    <text x="112" y="684">Also on every job:</text>
    <text x="270" y="684" font-weight="700" fill="#1f1612">Doorstep start code</text>
    <text x="470" y="684" fill="#5a4636">&#183;</text>
    <text x="486" y="684" font-weight="700" fill="#a93226">SOS button</text>
  </g>

  <text x="540" y="808" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#5a4636">Workers are ID-verified, and both sides rate each other after every job.</text>

  <rect x="290" y="846" width="500" height="70" rx="35" fill="#d97742"/>
  <text x="540" y="890" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#faf4ec">Hire with confidence &#183; workitsa.co.za</text>

  <text x="540" y="964" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#5a4636">Free during launch &#183; Gauteng</text>
</svg>
