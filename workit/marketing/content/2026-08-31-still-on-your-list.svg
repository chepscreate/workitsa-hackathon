<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit &#8212; still on your to-do list?</title>
  <desc>Cream Workit social post: wordmark, a mock to-do list showing "Fix the leaking tap" crossed off and tagged posted on Workit while two other jobs remain unticked, headline "Still on your to-do list? Not for long.", three quick steps, trust line, and workitsa.co.za call to action.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4ec"/>
      <stop offset="1" stop-color="#f1e2cc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#bg1)"/>

  <text x="540" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#d97742">WORKIT &#183; GAUTENG</text>
  <text x="540" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#1f1612">Workit</text>
  <rect x="490" y="170" width="100" height="6" rx="3" fill="#d97742"/>

  <!-- mock to-do list -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="110" y="200" width="860" height="160" rx="20" fill="#ffffff" stroke="#e6d7c3" stroke-width="2"/>
    <text x="140" y="230" font-size="16" font-weight="700" letter-spacing="2" fill="#5d7a47">YOUR TO-DO LIST</text>

    <circle cx="150" cy="268" r="14" fill="#5d7a47"/>
    <path d="M143 268 L148 274 L158 261" stroke="#faf4ec" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="176" y="275" font-size="23" fill="#9a8873" text-decoration="line-through">Fix the leaking tap</text>
    <rect x="686" y="250" width="234" height="36" rx="18" fill="#f0dcc2"/>
    <text x="803" y="273" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#b85a2a">POSTED ON WORKIT</text>

    <circle cx="150" cy="306" r="14" fill="none" stroke="#c9b8a3" stroke-width="2.5"/>
    <text x="176" y="313" font-size="23" fill="#1f1612">Trim the hedge</text>

    <circle cx="150" cy="344" r="14" fill="none" stroke="#c9b8a3" stroke-width="2.5"/>
    <text x="176" y="351" font-size="23" fill="#1f1612">Fix the gate hinge</text>
  </g>

  <text x="540" y="416" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#5a4636">One of these doesn&#8217;t have to wait anymore.</text>

  <text x="540" y="480" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" fill="#1f1612">Still on your to-do list?</text>
  <text x="540" y="536" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" fill="#d97742">Not for long.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="72" y="592" width="936" height="96" rx="16" fill="#f0dcc2"/>
      <circle cx="132" cy="640" r="26" fill="#d97742"/>
      <text x="132" y="649" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#faf4ec">1</text>
      <text x="180" y="649" font-size="24" fill="#1f1612">Post the job &#8212; takes two minutes</text>
    </g>
    <g>
      <rect x="72" y="706" width="936" height="96" rx="16" fill="#dee6d4"/>
      <circle cx="132" cy="754" r="26" fill="#5d7a47"/>
      <text x="132" y="763" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#faf4ec">2</text>
      <text x="180" y="763" font-size="24" fill="#1f1612">ID-verified workers nearby respond</text>
    </g>
    <g>
      <rect x="72" y="820" width="936" height="96" rx="16" fill="#f0dcc2"/>
      <circle cx="132" cy="868" r="26" fill="#b85a2a"/>
      <text x="132" y="877" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#faf4ec">3</text>
      <text x="180" y="877" font-size="24" fill="#1f1612">Pay cash or EFT once it&#8217;s done</text>
    </g>
  </g>

  <text x="540" y="956" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5a4636">No card needed &#183; free during launch &#183; launching in Gauteng</text>

  <rect x="220" y="984" width="640" height="70" rx="35" fill="#d97742"/>
  <text x="540" y="1028" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#faf4ec">Cross it off your list &#183; workitsa.co.za</text>
</svg>
