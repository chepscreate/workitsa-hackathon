<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit &#8212; cleaning category spotlight</title>
  <desc>Cream Workit social post spotlighting the cleaning category ahead of the festive season: wordmark, headline "Spotless before the season starts.", a card of cleaning service chips, three numbered steps (post the job, verified worker responds, pay when done), trust line, workitsa.co.za call to action.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4ec"/>
      <stop offset="1" stop-color="#f1e2cc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#bg1)"/>

  <text x="540" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#d97742">WORKIT &#183; GAUTENG</text>
  <text x="540" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#1f1612">Workit</text>
  <rect x="490" y="170" width="100" height="6" rx="3" fill="#d97742"/>

  <text x="540" y="234" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#1f1612">Spotless before</text>
  <text x="540" y="288" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#5d7a47">the season starts.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#5a4636" text-anchor="middle">
    <text x="540" y="330">Visitors coming in December? This week&#8217;s category: Cleaning.</text>
  </g>

  <!-- category chips card -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="120" y="366" width="840" height="182" rx="24" fill="#ffffff" stroke="#e6d7c3" stroke-width="2"/>
    <text x="156" y="406" font-size="18" font-weight="700" letter-spacing="2" fill="#5d7a47">CLEANING ON WORKIT</text>

    <g font-size="19" font-weight="700" fill="#faf4ec">
      <rect x="156" y="426" width="196" height="46" rx="23" fill="#5d7a47"/>
      <text x="254" y="455" text-anchor="middle">House cleaning</text>

      <rect x="366" y="426" width="206" height="46" rx="23" fill="#d97742"/>
      <text x="469" y="455" text-anchor="middle">Window cleaning</text>

      <rect x="586" y="426" width="150" height="46" rx="23" fill="#b85a2a"/>
      <text x="661" y="455" text-anchor="middle">Pool care</text>

      <rect x="156" y="484" width="184" height="46" rx="23" fill="#b85a2a"/>
      <text x="248" y="513" text-anchor="middle">Event cleanup</text>

      <rect x="354" y="484" width="176" height="46" rx="23" fill="#5d7a47"/>
      <text x="442" y="513" text-anchor="middle">Site cleaning</text>
    </g>
    <text x="900" y="513" text-anchor="end" font-size="19" font-weight="700" fill="#5a4636">+ more</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="72" y="580" width="936" height="106" rx="18" fill="#f0dcc2"/>
      <circle cx="136" cy="633" r="30" fill="#d97742"/>
      <text x="136" y="645" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#faf4ec">1</text>
      <text x="196" y="624" font-size="27" font-weight="700" fill="#1f1612">Post the cleaning job</text>
      <text x="196" y="658" font-size="19" fill="#5a4636">How many rooms, which day &#8212; and what you&#8217;ll pay.</text>
    </g>
    <g>
      <rect x="72" y="700" width="936" height="106" rx="18" fill="#dee6d4"/>
      <circle cx="136" cy="753" r="30" fill="#5d7a47"/>
      <text x="136" y="765" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#faf4ec">2</text>
      <text x="196" y="744" font-size="27" font-weight="700" fill="#1f1612">A verified cleaner nearby responds</text>
      <text x="196" y="778" font-size="19" fill="#5a4636">ID-verified, with a start code at your door so you know it&#8217;s them.</text>
    </g>
    <g>
      <rect x="72" y="820" width="936" height="106" rx="18" fill="#f0dcc2"/>
      <circle cx="136" cy="873" r="30" fill="#b85a2a"/>
      <text x="136" y="885" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#faf4ec">3</text>
      <text x="196" y="864" font-size="27" font-weight="700" fill="#1f1612">Pay when it&#8217;s sparkling</text>
      <text x="196" y="898" font-size="19" fill="#5a4636">Cash or EFT, straight to the worker. Then you rate each other.</text>
    </g>
  </g>

  <text x="540" y="970" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5a4636">No card needed &#183; free during launch &#183; launching in Gauteng</text>

  <rect x="230" y="1000" width="620" height="66" rx="33" fill="#d97742"/>
  <text x="540" y="1041" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#faf4ec">Book a cleaner &#183; workitsa.co.za</text>
</svg>
