<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit — You agree the price. You keep the price.</title>
  <desc>Trust post for Workit: pay cash or EFT only when the job is done, no commission during launch, verified workers.</desc>

  <rect x="0" y="0" width="1080" height="1080" fill="#F6EFE6"/>

  <!-- logo mark -->
  <g transform="translate(64,56) scale(1.35)">
    <rect x="6" y="6" width="52" height="52" rx="14" fill="#1F1710"/>
    <rect x="9" y="9" width="46" height="46" rx="11" fill="none" stroke="#F6EFE6" stroke-width="1.5" opacity=".55"/>
    <path d="M14 19L21 47L28 30L36 47L43 30Q47 22 50 19L50 50" stroke="#F6EFE6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="43" y1="22" x2="57" y2="22" stroke="#F6EFE6" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <text x="175" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#1F1710">Workit</text>

  <rect x="700" y="70" width="316" height="46" rx="23" fill="#5E7D63" opacity="0.15"/>
  <text x="858" y="99" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#3F5A43">LAUNCHING IN GAUTENG</text>

  <!-- headline -->
  <text x="70" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" fill="#1F1710">You agree the price.</text>
  <text x="70" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" fill="#1F1710">You keep the price.</text>

  <!-- subtext -->
  <text x="70" y="416" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#5A4A3C">Pay cash or EFT only once the job is done —</text>
  <text x="70" y="456" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#5A4A3C">no commission during launch on Workit.</text>

  <!-- icon row: handshake, coin, shield-check -->
  <g>
    <circle cx="245" cy="620" r="92" fill="#5E7D63" opacity="0.16"/>
    <circle cx="540" cy="620" r="92" fill="#C2632E" opacity="0.14"/>
    <circle cx="835" cy="620" r="92" fill="#5E7D63" opacity="0.16"/>
  </g>

  <!-- Price tag -->
  <g transform="translate(245,620)">
    <path d="M-34,-6 L4,-38 L40,-2 L4,36 Z" fill="none" stroke="#1F1710" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="-12" cy="-22" r="7" fill="#1F1710"/>
  </g>

  <!-- Coin (cash/EFT) -->
  <g transform="translate(540,620)">
    <circle r="36" fill="none" stroke="#1F1710" stroke-width="7"/>
    <text x="0" y="13" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#1F1710">R</text>
  </g>

  <!-- Shield check (no commission / protected) -->
  <g transform="translate(835,620)">
    <path d="M0,-38 L34,-24 L34,8 C34,30 18,42 0,50 C-18,42 -34,30 -34,8 L-34,-24 Z" fill="#1F1710"/>
    <path d="M-15,1 L-4,13 L17,-12" stroke="#F6EFE6" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#1F1710" text-anchor="middle">
    <text x="245" y="752">Fair price</text>
    <text x="540" y="752">Pay on completion</text>
    <text x="835" y="752">No commission</text>
  </g>

  <!-- chips -->
  <rect x="150" y="822" width="290" height="56" rx="28" fill="#C2632E" opacity="0.12"/>
  <rect x="460" y="822" width="260" height="56" rx="28" fill="#C2632E" opacity="0.12"/>
  <rect x="740" y="822" width="190" height="56" rx="28" fill="#C2632E" opacity="0.12"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#9A4E22" text-anchor="middle">
    <text x="295" y="858">Free during launch</text>
    <text x="590" y="858">Verified workers</text>
    <text x="835" y="858">Cash or EFT</text>
  </g>

  <!-- CTA -->
  <rect x="260" y="930" width="560" height="86" rx="43" fill="#C2632E"/>
  <text x="540" y="984" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#F6EFE6">Get started &#183; workitsa.co.za</text>

  <text x="540" y="1048" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8A7A6B">Furthersky Solutions &#183; Workit</text>
</svg>
