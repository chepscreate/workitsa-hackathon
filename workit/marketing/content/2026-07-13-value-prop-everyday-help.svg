<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit &#8212; whatever needs doing, help is nearby</title>
  <desc>Cream Workit social post: wordmark, headline "Whatever needs doing, help is nearby.", four category chips (garden, clean, deliver, fix), a three-line value list, workitsa.co.za call to action and trilingual greeting.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4ec"/>
      <stop offset="1" stop-color="#f1e2cc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#bg1)"/>

  <text x="540" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#d97742">WORKIT &#183; GAUTENG</text>
  <text x="540" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#1f1612">Workit</text>
  <rect x="490" y="170" width="100" height="6" rx="3" fill="#d97742"/>

  <text x="540" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#1f1612">Whatever needs doing,</text>
  <text x="540" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#1f1612">help is nearby.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="72" y="346" width="220" height="150" rx="18" fill="#f0dcc2"/>
      <circle cx="182" cy="404" r="30" fill="#5d7a47"/>
      <path d="M182 390 l14 14 -14 14 -14 -14 Z" fill="#faf4ec"/>
      <text x="182" y="466" text-anchor="middle" font-size="20" font-weight="700" fill="#1f1612">Garden</text>
    </g>
    <g>
      <rect x="304" y="346" width="220" height="150" rx="18" fill="#dee6d4"/>
      <circle cx="414" cy="404" r="30" fill="#d97742"/>
      <circle cx="414" cy="404" r="12" fill="#faf4ec"/>
      <text x="414" y="466" text-anchor="middle" font-size="20" font-weight="700" fill="#1f1612">Clean</text>
    </g>
    <g>
      <rect x="536" y="346" width="220" height="150" rx="18" fill="#f0dcc2"/>
      <circle cx="646" cy="404" r="30" fill="#b85a2a"/>
      <rect x="632" y="392" width="28" height="20" rx="3" fill="#faf4ec"/>
      <text x="646" y="466" text-anchor="middle" font-size="20" font-weight="700" fill="#1f1612">Deliver</text>
    </g>
    <g>
      <rect x="768" y="346" width="220" height="150" rx="18" fill="#dee6d4"/>
      <circle cx="878" cy="404" r="30" fill="#5d7a47"/>
      <rect x="866" y="390" width="24" height="8" rx="4" fill="#faf4ec" transform="rotate(45 878 404)"/>
      <rect x="866" y="400" width="24" height="8" rx="4" fill="#faf4ec" transform="rotate(-45 878 404)"/>
      <text x="878" y="466" text-anchor="middle" font-size="20" font-weight="700" fill="#1f1612">Fix</text>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <circle cx="120" cy="576" r="7" fill="#d97742"/>
      <text x="150" y="584" font-size="26" fill="#1f1612">Post the job &#8212; takes two minutes</text>
    </g>
    <g>
      <circle cx="120" cy="632" r="7" fill="#5d7a47"/>
      <text x="150" y="640" font-size="26" fill="#1f1612">ID-verified workers nearby respond</text>
    </g>
    <g>
      <circle cx="120" cy="688" r="7" fill="#b85a2a"/>
      <text x="150" y="696" font-size="26" fill="#1f1612">Pay cash or EFT once it&#8217;s done</text>
    </g>
  </g>

  <text x="540" y="768" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5a4636">No card needed &#183; free during launch &#183; launching in Gauteng</text>

  <rect x="230" y="806" width="620" height="70" rx="35" fill="#d97742"/>
  <text x="540" y="850" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#faf4ec">Get it done &#183; workitsa.co.za</text>

  <text x="540" y="936" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#5d7a47">Sawubona &#183; Dumela &#183; Goeie dag</text>
</svg>
