<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit &#8212; the doorstep start code</title>
  <desc>Cream Workit social post: wordmark, headline "Four digits at the door.", an illustrated door with a four-box code panel, three steps explaining the doorstep start code, trust line and workitsa.co.za call to action.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4ec"/>
      <stop offset="1" stop-color="#f1e2cc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#bg1)"/>

  <text x="540" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#d97742">WORKIT &#183; SAFETY</text>
  <text x="540" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#1f1612">Workit</text>
  <rect x="490" y="170" width="100" height="6" rx="3" fill="#d97742"/>

  <text x="540" y="252" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" fill="#1f1612">Four digits at the door.</text>
  <text x="540" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5a4636">So you know it&#8217;s the right person before the job starts.</text>

  <!-- Door illustration -->
  <g>
    <rect x="96" y="340" width="300" height="400" rx="14" fill="#b85a2a"/>
    <rect x="120" y="364" width="252" height="352" rx="8" fill="#d97742"/>
    <rect x="144" y="392" width="204" height="130" rx="6" fill="#b85a2a" opacity="0.35"/>
    <rect x="144" y="550" width="204" height="140" rx="6" fill="#b85a2a" opacity="0.35"/>
    <circle cx="336" cy="560" r="12" fill="#faf4ec"/>
    <rect x="72" y="740" width="348" height="14" rx="4" fill="#1f1612" opacity="0.8"/>
    <!-- code panel -->
    <rect x="132" y="430" width="228" height="96" rx="14" fill="#faf4ec"/>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#1f1612" text-anchor="middle">
      <rect x="146" y="448" width="44" height="60" rx="8" fill="#f0dcc2"/>
      <rect x="198" y="448" width="44" height="60" rx="8" fill="#f0dcc2"/>
      <rect x="250" y="448" width="44" height="60" rx="8" fill="#f0dcc2"/>
      <rect x="302" y="448" width="44" height="60" rx="8" fill="#f0dcc2"/>
      <circle cx="168" cy="478" r="8"/>
      <circle cx="220" cy="478" r="8"/>
      <circle cx="272" cy="478" r="8"/>
      <circle cx="324" cy="478" r="8"/>
    </g>
  </g>

  <!-- Steps -->
  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="444" y="340" width="564" height="120" rx="18" fill="#f0dcc2"/>
      <circle cx="500" cy="400" r="30" fill="#d97742"/>
      <text x="500" y="413" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#faf4ec">1</text>
      <text x="550" y="390" font-size="26" font-weight="700" fill="#1f1612">You get a code</text>
      <text x="550" y="424" font-size="18" fill="#5a4636">Each job has its own 4-digit start</text>
      <text x="550" y="448" font-size="18" fill="#5a4636">code, shown only to you.</text>
    </g>
    <g>
      <rect x="444" y="480" width="564" height="120" rx="18" fill="#dee6d4"/>
      <circle cx="500" cy="540" r="30" fill="#5d7a47"/>
      <text x="500" y="553" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#faf4ec">2</text>
      <text x="550" y="530" font-size="26" font-weight="700" fill="#1f1612">Read it at the door</text>
      <text x="550" y="564" font-size="18" fill="#5a4636">When your worker arrives, you</text>
      <text x="550" y="588" font-size="18" fill="#5a4636">tell them the code in person.</text>
    </g>
    <g>
      <rect x="444" y="620" width="564" height="120" rx="18" fill="#f0dcc2"/>
      <circle cx="500" cy="680" r="30" fill="#b85a2a"/>
      <text x="500" y="693" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#faf4ec">3</text>
      <text x="550" y="670" font-size="26" font-weight="700" fill="#1f1612">The job begins</text>
      <text x="550" y="704" font-size="18" fill="#5a4636">They enter it in the app &#8212; only</text>
      <text x="550" y="728" font-size="18" fill="#5a4636">then can the job be started.</text>
    </g>
  </g>

  <text x="540" y="806" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#5a4636">ID-verified on both sides &#183; trusted-contact share &#183; SOS on every job</text>

  <rect x="250" y="840" width="580" height="70" rx="35" fill="#d97742"/>
  <text x="540" y="884" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#faf4ec">Free during launch &#183; workitsa.co.za</text>

  <text x="540" y="966" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#5d7a47">Launching in Gauteng</text>
</svg>
