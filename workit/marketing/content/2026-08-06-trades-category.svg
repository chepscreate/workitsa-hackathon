  <text x="70" y="428" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#5a4636">Verified plumbers, sparkies and painters near you —</text>
  <text x="70" y="466" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#5a4636">you agree a fair price and pay when it's done.</text>

