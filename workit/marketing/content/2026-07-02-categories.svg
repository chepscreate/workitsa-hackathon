<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit category post — whatever the job, someone nearby can do it</title>
  <desc>Cream Workit social post: wordmark, headline "Whatever the job — someone nearby can do it", four category cards (gardening, cleaning, trades, errands), a trust line, and a workitsa.co.za call to action.</desc>
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4ec"/>
      <stop offset="1" stop-color="#f1e2cc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1080" height="1080" fill="url(#cbg)"/>

  <text x="540" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#d97742">WORKIT · GAUTENG</text>
  <text x="540" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#1f1612">Workit</text>
  <rect x="490" y="170" width="100" height="6" rx="3" fill="#d97742"/>

  <text x="540" y="256" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#1f1612">Whatever the job —</text>
  <text x="540" y="316" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#1f1612">someone nearby can do it.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="72" y="382" width="456" height="138" rx="18" fill="#dee6d4"/>
      <text x="100" y="440" font-size="30" font-weight="700" fill="#1f1612">Gardening &amp; lawn</text>
      <text x="100" y="474" font-size="18" fill="#5a4636">mowing · tidying · pool care</text>
    </g>
    <g>
      <rect x="552" y="382" width="456" height="138" rx="18" fill="#f0dcc2"/>
      <text x="580" y="440" font-size="30" font-weight="700" fill="#1f1612">Home cleaning</text>
      <text x="580" y="474" font-size="18" fill="#5a4636">homes · offices · move-outs</text>
    </g>
    <g>
      <rect x="72" y="540" width="456" height="138" rx="18" fill="#f0dcc2"/>
      <text x="100" y="598" font-size="30" font-weight="700" fill="#1f1612">Trades &amp; repairs</text>
      <text x="100" y="632" font-size="18" fill="#5a4636">plumbing · electrical · painting</text>
    </g>
    <g>
      <rect x="552" y="540" width="456" height="138" rx="18" fill="#dee6d4"/>
      <text x="580" y="598" font-size="30" font-weight="700" fill="#1f1612">Deliveries &amp; errands</text>
      <text x="580" y="632" font-size="18" fill="#5a4636">bakkie hire · shopping · queues</text>
    </g>
  </g>

  <text x="540" y="742" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5a4636">Verified workers near you · paid on completion · free during launch</text>

  <rect x="260" y="782" width="560" height="70" rx="35" fill="#d97742"/>
  <text x="540" y="826" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#faf4ec">Post a job or find work · workitsa.co.za</text>

  <text x="540" y="912" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#5d7a47">Sawubona · Dumela · Goeie dag</text>
</svg>
