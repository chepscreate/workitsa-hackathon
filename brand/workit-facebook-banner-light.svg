  <desc>Bright cream-and-ink branded cover for Workit: the wordmark, the tagline "Work needs doing. Someone nearby is ready to do it.", a Sawubona / Dumela / Goeie dag greeting, a Launching in Gauteng badge, the workitsa.co.za address, and a map-pin hotspot motif.</desc>
