<svg width="1640" height="624" viewBox="0 0 1640 624" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit Facebook cover banner (dark)</title>
  <desc>Warm clay-and-cream branded cover for Workit: the wordmark, the tagline "Work needs doing. Someone nearby is ready to do it.", a Sawubona / Dumela / Goeie dag greeting, a Launching in Gauteng badge, the workitsa.co.za address, and a map-pin hotspot motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1108"/>
      <stop offset="0.45" stop-color="#2f1a0d"/>
      <stop offset="1" stop-color="#a4491c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4ad5e" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f4ad5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a0f07" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#1a0f07" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1640" height="624" fill="url(#bg)"/>
  <circle cx="1460" cy="110" r="340" fill="url(#sun)"/>

