<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Workit ad — everyday jobs across Gauteng</title>
  <desc>A glowing heat map of Gauteng peppered with job pins from Pretoria in the north to Vereeniging in the south, under the Workit wordmark, with the line "Everyday jobs, all over Gauteng" and a get-started call to action.</desc>
  <defs>
    <linearGradient id="adbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0f07"/>
      <stop offset="1" stop-color="#2c180c"/>
    </linearGradient>
    <radialGradient id="hot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd271" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#f4892f" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f4892f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ef7a33" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ef7a33" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="red" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d6402a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d6402a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1080" fill="url(#adbg)"/>
