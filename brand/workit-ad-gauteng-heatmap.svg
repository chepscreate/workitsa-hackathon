    <line x1="180" y1="600" x2="900" y2="600"/>
    <line x1="180" y1="750" x2="900" y2="750"/>
  </g>

  <text x="540" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#e0a866">GIG-WORK MARKETPLACE · GAUTENG</text>
  <text x="540" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" fill="#fbf4e8">Workit</text>
